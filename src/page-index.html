          <div

              gap: 30px;

          </div>

    </main>

<script>
(function () {
        // 读取 post_list.json（python 生成的静态数据）
        fetch("post_list.json")
          .then(function (res) {
            if (!res.ok)
              throw new Error("post_list.json 加载失败: " + res.status);
            return res.json();
          })
          .then(function (posts) {
            renderRecentGrid(posts);
          })
          .catch(function (err) {
            console.error(err);
          });

        function renderRecentGrid(posts) {
          var grid = document.getElementById("recent-grid");
          if (!grid) return;

          // 展示最多 5 篇；若文章总数 > 5，则在第 6 格（第 3 行第 2 个）显示 "..." 省略号
          var maxItems = 5;
          var shown = posts.slice(0, maxItems);
          var hasMore = posts.length > maxItems;

          var html = "";

          shown.forEach(function (post) {
            // 点击跳转的只有标题（用 post-title，hover 变红）
            var titleLink =
              '<a href="{{BASE}}posts/' +
              encodeURI(post.filename) +
              '" style="font-size:20px;" class="post-title">' +
              escapeHtml(post.title) +
              "</a>";

            var desc = post.description
              ? '<p style="font-size:16px; margin:20px 0 0 0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">' +
                escapeHtml(post.description) +
                "</p>"
              : "";

            html +=
              '<div style="display:flex; flex-direction:column;">' +
              '<span style="font-family:Consolas; font-size:14px; color:#666666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
              formatDate(post.date) +
              "&nbsp" +
              "</span>" +
              '<span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
              titleLink +
              "</span>" +
              desc +
              "</div>";
          });

          if (hasMore) {
            html +=
              '<p style="display:flex; align-items:center; font-size:22px; color:#333333;" >' +
              "..." +
              "</p>";
          }

          grid.innerHTML = html;
        }

        // 网络防御：转义 HTML
        function escapeHtml(str) {
          var div = document.createElement("div");
          div.textContent = String(str == null ? "" : str);
          return div.innerHTML;
        }

        // 将 "2026-03-26" 格式化为 "26 Mar 2026"
        function formatDate(dateStr) {
          if (!dateStr) return "";
          var parts = dateStr.split("-");
          if (parts.length !== 3) return dateStr;
          var months = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec",
          ];
          var m = parseInt(parts[1], 10) - 1;
          var monthName = months[m] || parts[1];
          return parseInt(parts[2], 10) + " " + monthName + " " + parts[0];
        }
      })();
</script>
