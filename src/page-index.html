        <a href="" class="post-link">./</a> 哦不我的小垃圾

      <div
        style="
          display: grid;
          grid-template-columns: 1fr 1fr;

        <!-- 手动添加的项目，每个都是一个 cell，复制这个块即可 -->

        </div>
        <!-- 在这行下面复制上面的 cell 继续添加新项目 -->
      </div>

</main>

<script>
  (function () {
    // 读取 post_list.json（python 生成的静态数据）否则返回失败
    fetch("post_list.json")
      // res就是由上文post_list.json通过then链自动传来的
      .then(function (res) {
        if (!res.ok) throw new Error("post_list.json 加载失败: " + res.status);
        return res.json();
      })
      .then(function (posts) {
        // 传参名字随便取
        renderRecentGrid(posts);
      })
      .catch(function (err) {
        console.error(err);
      });

    // 666 原来JSP中对于函数的定义和调用先后没有要求，例如renderRecentGrid()就在调用的后面
    function renderRecentGrid(posts) {
      // 接受post_list.json作为传参
      // 生成Recent的grid中的html样式
      var grid = document.getElementById("recent-grid"); // 接受上文的grid
      if (!grid) return;

      // 展示最多 5 篇；若文章总数 > 5，则在第 6 格（第 3 行第 2 个）显示 "..." 省略号
      var maxItems = 5;
      var shown = posts.slice(0, maxItems); // 数组.slice()将切片posts[0, 5]给shown
      var hasMore = posts.length > maxItems; // bool对象：posts长度是否超过maxItems

      var html = "";

      shown.forEach(function (post) {
        // 点击跳转的只有标题（用 post-title，hover 变红）
        var titleLink =
          '<a href="{{BASE}}posts/' +
          encodeURI(post.filename) + // 用转为百分号编码的filename作为href地址名
          '" style="font-size:20px;" class="post-title">' +
          escapeHtml(post.title) + // 哈哈，这里将title转成纯文本，起到防御效果
          "</a>";

        var desc = post.description // description
          ? '<p style="font-size:16px; margin:20px 0 0 0; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;">' +
            escapeHtml(post.description) +
            "</p>"
          : "";

        html += // 加一个文章card
          '<div style="display:flex; flex-direction:column;">' +
          '<span style="font-family:Consolas; font-size:14px; color:#666666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
          formatDate(post.date) +
          "&nbsp" +
          "</span>" +
          '<span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
          titleLink +
          "</span>" +
          desc +
          "</div>";
      });

      if (hasMore) {
        html +=
          '<p style="display:flex; align-items:center; font-size:22px; color:#333333;" >' +
          "..." +
          "</p>";
      }

      grid.innerHTML = html;
    }

    // 网络防御：转义 HTML
    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = String(str == null ? "" : str);
      return div.innerHTML;
    }

    // 格式化：将 "2026-03-26" 格式化为 "26 Mar 2026"
    function formatDate(dateStr) {
      if (!dateStr) return "";
      var parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      var months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      var m = parseInt(parts[1], 10) - 1;
      var monthName = months[m] || parts[1];
      return parseInt(parts[2], 10) + " " + monthName + " " + parts[0];
    }
  })();
</script>
