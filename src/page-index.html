<!-- 首页正文（原本是 home.html 的内容，现已并入 index.html）。
     由 scripts/inject_layout.py 注入到 index.html 的 #content_container 里。
     {{BASE}} 是到站点根目录的相对前缀。 -->

<main id="main">
  <div style="display: flex; align-items: center">
    <img
      src="{{BASE}}images/波球在棕色的草丛里.webp"
      style="width: 1000px; height: 147px"
    />
  </div>

  <div
    style="display: flex; align-items: center; gap: 8px; margin-top: -25px auto"
  >
    <span>
      嗨你好，欢迎光临小波球的博物馆！ BUGSQUASH! *啵…啵啾…*
      <br />我使用了纯html和css搭建了这个网页，目前仅保证Win端访问体验，Linux和Android端适配将不日上线。
      <br />
      <br />
      <span style="font-weight: 600">关于友链：</span
      >建站伊始，评论功能尚未完善，您可以通过Issues给我发送您的个人网站网址和希望呈现的名字。<br />
      格式参照 &lt;a href="WEBURL"&gt;WEBNAME&lt;/a&gt;
    </span>
  </div>

  <hr style="margin-top: 20px" />
  <div>
    <div style="margin-top: 35px">
      <span style="font-size: 28px"> 最近写了什么？ </span>

      <!-- 此处存放文章列表 -->
      <div
        id="recent-grid"
        style="
          display: grid;
          grid-template-columns: 1fr;
          gap: 20px;
          margin-top: 20px;
        "
      ></div>
      <!-- JS填充内容 -->
    </div>

    <div style="margin-top: 50px">
      <span style="font-size: 28px"> 波球也能写的小垃圾 </span>
      <div
        style="
          display: grid;
          grid-template-columns: 1frs;
          gap: 20px;
          margin-top: 20px;
        "
      >
        <!-- 手动添加的项目，每个都是一个 cell，复制这个块即可 -->
        <div
          style="
            display: flex;
            flex-direction: row;
            /* 其实是自动横向的吧 */
            align-items: baseline;
            gap: 12px;
            min-width: 0;
          "
        >
          <spans
            style="
              font-family: Consolas;
              font-size: 14px;
              color: #666666;
              white-space: nowrap;
              flex-shrink: 0;
            "
            >02 Jul 2026</spans
          >
          <a
            href="https://github.com/zly3070/cpp_homeworks/tree/main/%E7%A8%8B%E5%BA%8F%E8%AE%BE%E8%AE%A1%E8%AF%BE%E5%A4%A7%E4%BD%9C%E4%B8%9A/AlumniSystem"
            style="font-size: 20px; width: fit-content; flex-shrink: 0"
            class="post-title"
            target="_blank"
          >
            校友录系统
          </a>
          <span
            style="
              font-size: 16px;
              color: #898e96;
              flex: 1 1 auto;
              min-width: 0;
              white-space: nowrap;
              /* 文字不换行 */
              overflow: hidden;
              /* 超出容器部分藏起来 */
              text-overflow: ellipsis;
              /* 被裁掉部分用省略号表示 */
            "
          >
            基于 C++ 和 FTXUI
            库开发的校友录管理系统，提供图形化终端界面（TUI），支持校友信息的增删改查和持久化存储。
          </span>
        </div>
        <!-- 在这行下面复制上面的 cell 继续添加新项目 -->
      </div>
    </div>
  </div>
</main>

<script>
  (function () {
    // 读取 post_list.json（python 生成的静态数据）否则返回失败
    fetch("post_list.json")
      // res就是由上文post_list.json通过then链自动传来的
      .then(function (res) {
        if (!res.ok) throw new Error("post_list.json 加载失败: " + res.status);
        return res.json();
      })
      .then(function (posts) {
        // 传参名字随便取
        renderRecentGrid(posts);
      })
      .catch(function (err) {
        console.error(err);
      });

    // 666 原来JSP中对于函数的定义和调用先后没有要求，例如renderRecentGrid()就在调用的后面
    function renderRecentGrid(posts) {
      var grid = document.getElementById("recent-grid");
      if (!grid) return;

      // var maxItems = 5; 我需要全部，不切片了
      var shown = posts.slice();
      // var hasMore = posts.length > maxItems;

      var html = "";

      shown.forEach(function (post) {
        // 日期：不缩放，永远完整显示
        var dateSpan =
          '<span style="font-family:Consolas; font-size:14px; color:#666666;' +
          ' white-space:nowrap; flex-shrink:0;">' +
          formatDate(post.date) +
          "</span>";

        // 标题：不缩放
        var titleLink =
          '<a href="{{BASE}}posts/' +
          encodeURI(post.filename) +
          '"' +
          ' style="font-size:20px; white-space:nowrap; flex-shrink:0;"' +
          ' class="post-title">' +
          escapeHtml(post.title) +
          "</a>";

        // 描述：占满剩余空间，超出就省略号
        // flex:1 1 auto 让它可伸可缩；min-width:0 是关键 —— 不写的话
        // flex 子项默认 min-width:auto（不能小于内容宽度），
        // overflow:hidden 就永远不触发，省略号不会出现（这个坑踩过）。
        var desc = post.description
          ? '<span style="font-size:16px; color:#898e96;' +
            " flex:1 1 auto; min-width:0;" +
            ' white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' +
            escapeHtml(post.description) +
            "</span>"
          : "";

        // 一整行：日期 + 标题 + 描述
        html +=
          '<div style="display:flex; align-items:baseline; gap:12px; min-width:0;">' +
          dateSpan +
          titleLink +
          desc +
          "</div>";
      });

      // if (hasMore) {
      //   html +=
      //     '<p style="display:flex; align-items:center; font-size:22px; color:#333333;">' +
      //     "..." +
      //     "</p>";
      // }

      grid.innerHTML = html;
    }

    // 网络防御：转义 HTML
    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = String(str == null ? "" : str);
      return div.innerHTML;
    }

    // 格式化：将 "2026-03-26" 格式化为 "26 Mar 2026"
    function formatDate(dateStr) {
      if (!dateStr) return "";
      var parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      var months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      var m = parseInt(parts[1], 10) - 1;
      var monthName = months[m] || parts[1];
      return parseInt(parts[2], 10) + " " + monthName + " " + parts[0];
    }
  })();
</script>
