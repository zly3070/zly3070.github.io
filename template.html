<!doctype html>
<html lang="zh-CN" data-layout="sidebar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$title$ - Lyon Dev</title>
    <!-- canonical 由 scripts/inject_layout.py 按真实文件名填入（含百分号编码） -->
    <link rel="canonical" href="" />
    <!-- 描述也由注入器按文章逐篇补上 -->
    <meta name="description" content="" />
    <link rel="stylesheet" href="../style.css" />
    <!-- 使用 MathJax 渲染公式 -->
    <script
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
      async
    ></script>
    <style>
      /* 文章页模板自己的布局。
         生成出来的文章在 posts/ 目录下，所以上面引用 ../style.css。
         基础样式统一在 style.css 里，改样式只改那一个文件，不用重新生成文章。 */

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }


      /* 页脚里的元素不留默认边距，间距由页内行内 style 控制 */
      footer * {
        padding: 0;
        margin: 0;
      }
    </style>
      <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$title$</title>
    <script
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
      async
    ></script>
  
  </head>

  <body>
    <!-- LAYOUT_START -->
    <!-- CONTAINER_START -->
    <main id="main">
      <h1 style="margin: 0px">
        <a
          href="../index.html"
          class="post-link"
         
          style="text-decoration: none; margin: 0px"
          >~/</a
        >
      </h1>
      <hr width="100%" style="margin-top: 0px; margin-bottom: 40px" />
      $body$
    </main>
  
    <!-- CONTAINER_END -->
    <!-- LAYOUT_END -->
  </body>
</html>
