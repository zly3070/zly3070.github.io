name: Build and Deploy Site

# 触发：只监听「源」。产物（index.html / posts/*.html / style.css …）不再进仓库，
# 所以不需要监听它们。
on:
  push:
    branches: [main]
    paths:
      - "src/**" # 所有源：骨架 / 侧栏 / 各页正文 / 样式
      - "posts/*.md" # 文章内容
      - "photos.json" # 照片墙数据
      - "scripts/**"
      - ".github/workflows/AutoPost.yml"
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Pandoc
        id: cache-pandoc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/pandoc
          key: ${{ runner.os }}-pandoc-3.10

      - name: Setup Pandoc
        if: steps.cache-pandoc.outputs.cache-hit != 'true'
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10

      # 唯一的构建入口：pandoc + 组装页面 + sitemap/robots/post_list。
      # --site-dir 产出一份「干净的站点目录」：只有站点文件，
      # 不含 src/ scripts/ .git/，不会把源码一起发布出去。
      # 本地预览（scripts/serve.py）调用的是同一份构建逻辑。
      - name: Build site
        run: python3 scripts/build.py --site-dir _site

      # 自检：结构完整 / 幂等 / 行尾统一。发现问题就让构建失败，
      # 免得把坏页面部署上线。
      - name: Verify build
        run: python3 scripts/check_build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
