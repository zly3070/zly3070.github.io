name: Build and Deploy Site # 构建并部署到 GitHub Pages

on: # 触发条件
  push:
    branches: [main]
    paths:
      - "posts/*.md" # 文章内容
      - "template.html" # 文章模板
      - "_partials/*.html" # 侧栏 / 首页正文等共享骨架
      - "index.html" # 首页骨架
      - "about.html"
      - "Recent.html"
      - "style.css"
      - "photos.json" # 照片墙数据
      - "scripts/**"
      - ".github/workflows/AutoPost.yml"
  workflow_dispatch: # 也支持手动触发

# 赋予部署权限
permissions:
  contents: read # 只需要读权限，不用写回仓库
  pages: write # 允许部署到 Pages
  id-token: write # 用于验证

# 防止同时部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Pandoc
        id: cache-pandoc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/pandoc
          key: ${{ runner.os }}-pandoc-3.10

      - name: Setup Pandoc
        if: steps.cache-pandoc.outputs.cache-hit != 'true'
        uses: pandoc/actions/setup@v1
        with:
          version: 3.10

      # 每个 posts/*.md 用 template.html 生成对应的 .html。
      # 生成的页面里带 CONTAINER 标记（正文），下一步注入侧栏。
      - name: Convert Markdown to HTML
        run: |
          for file in posts/*.md; do
            [ -f "$file" ] || continue
            filename=$(basename "$file" .md)

            # 日期（形如 2026-03-26）
            date_part=$(echo "$filename" | grep -oP '^\d{4}-\d{2}-\d{2}' || true)
            # 标题（去掉日期前缀）
            title_part=$(echo "$filename" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')

            echo "Converting: $file  (date=$date_part title=$title_part)"

            pandoc "$file" \
              -f markdown+tex_math_dollars \
              --template=template.html \
              --metadata title="${title_part}" \
              --mathjax \
              -o "posts/${filename}.html"

            # 供生成 post_list.json 使用
            echo "${date_part}|${title_part}|${filename}.html" >> post_list.txt
          done

      # 注入侧栏/页脚：把 _partials/sidebar.html 注入每个页面，
      # 同时生成 sitemap.xml 和 robots.txt。
      # 本地预览（scripts/serve.py）调用的是同一个脚本，保证两边一致。
      - name: Inject shared layout and generate sitemap
        run: python scripts/inject_layout.py

      - name: Generate post_list.json
        run: python scripts/UpdateHomehtml.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
